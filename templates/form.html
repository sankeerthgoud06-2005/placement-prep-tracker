<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit opportunity · PrepTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">P</span><span>Prep<span class="brand-light">Track</span><small>YOUR PLACEMENT DASHBOARD</small></span></a><a class="button" href="{{ url_for('index') }}">← Back</a></header><section class="panel edit-panel"><p class="eyebrow">UPDATE YOUR PIPELINE</p><h1>Edit opportunity</h1><form method="post" class="entry-form"><label>Company name<input name="company" value="{{ application.company }}" required maxlength="100"></label><label>Role<input name="role" value="{{ application.role }}" required maxlength="120"></label><label>Status<select name="status">{% for s in statuses %}<option {% if application.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><div class="two-cols"><label>Deadline<input name="deadline" type="date" value="{{ application.deadline }}"></label><label>Applied on<input name="applied_on" type="date" value="{{ application.applied_on }}"></label></div><label>Job link<input name="job_url" type="url" value="{{ application.job_url }}"></label><label>Notes<textarea name="notes" rows="4">{{ application.notes }}</textarea></label><button class="button primary full" type="submit">Save changes →</button></form></section></main></body></html>
